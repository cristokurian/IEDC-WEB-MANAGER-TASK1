<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;family=Inter:wght@400;500&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#F7F7F2"/>

  <!-- Left accent panel -->
  <rect x="0" y="0" width="8" height="630" fill="#2563EB"/>

  <!-- Right side dark panel -->
  <rect x="720" y="0" width="480" height="630" fill="#171717"/>

  <!-- Network graphic dots (right panel decoration) -->
  <circle cx="800" cy="120" r="6" fill="#2563EB" opacity="0.8"/>
  <circle cx="900" cy="200" r="10" fill="#2563EB" opacity="0.9"/>
  <circle cx="1050" cy="160" r="5" fill="#2563EB" opacity="0.6"/>
  <circle cx="980" cy="320" r="8" fill="#2563EB" opacity="0.7"/>
  <circle cx="830" cy="380" r="12" fill="#2563EB" opacity="0.5"/>
  <circle cx="1100" cy="420" r="6" fill="#2563EB" opacity="0.6"/>
  <circle cx="860" cy="500" r="4" fill="#2563EB" opacity="0.4"/>
  <circle cx="1020" cy="520" r="7" fill="#2563EB" opacity="0.5"/>

  <!-- Connection lines -->
  <line x1="800" y1="120" x2="900" y2="200" stroke="#2563EB" stroke-width="1" opacity="0.3"/>
  <line x1="900" y1="200" x2="1050" y2="160" stroke="#2563EB" stroke-width="1" opacity="0.3"/>
  <line x1="900" y1="200" x2="980" y2="320" stroke="#2563EB" stroke-width="1" opacity="0.3"/>
  <line x1="980" y1="320" x2="830" y2="380" stroke="#2563EB" stroke-width="1" opacity="0.3"/>
  <line x1="980" y1="320" x2="1100" y2="420" stroke="#2563EB" stroke-width="1" opacity="0.3"/>
  <line x1="830" y1="380" x2="860" y2="500" stroke="#2563EB" stroke-width="1" opacity="0.3"/>
  <line x1="1100" y1="420" x2="1020" y2="520" stroke="#2563EB" stroke-width="1" opacity="0.3"/>

  <!-- Outlined circles -->
  <circle cx="800" cy="120" r="18" stroke="#3B82F6" stroke-width="1" fill="none" opacity="0.4"/>
  <circle cx="900" cy="200" r="22" stroke="#3B82F6" stroke-width="1" fill="none" opacity="0.3"/>
  <circle cx="980" cy="320" r="20" stroke="#3B82F6" stroke-width="1" fill="none" opacity="0.3"/>

  <!-- Left content -->
  <!-- Eyebrow -->
  <text x="64" y="140" font-family="'Inter', sans-serif" font-size="14" font-weight="500" letter-spacing="0.25em" fill="#6B7280" text-transform="uppercase">24-HOUR IDEATHON</text>

  <!-- Date badge -->
  <rect x="62" y="156" width="220" height="32" rx="16" fill="none" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="172" y="177" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#6B7280" text-anchor="middle">NOV 14–15, 2026</text>

  <!-- Main headline -->
  <text x="64" y="285" font-family="'Space Grotesk', sans-serif" font-size="80" font-weight="700" fill="#171717" letter-spacing="-2">IDEAS</text>
  <text x="64" y="370" font-family="'Space Grotesk', sans-serif" font-size="80" font-weight="700" fill="#171717" letter-spacing="-2">DON'T</text>
  <text x="64" y="455" font-family="'Space Grotesk', sans-serif" font-size="80" font-weight="700" fill="#171717" letter-spacing="-2">BUILD</text>
  <!-- THEMSELVES in accent blue -->
  <text x="64" y="540" font-family="'Space Grotesk', sans-serif" font-size="62" font-weight="700" fill="#2563EB" letter-spacing="-1.5">THEMSELVES.</text>

  <!-- Right panel content -->
  <!-- Event name -->
  <text x="760" y="260" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700" fill="#F7F7F2" letter-spacing="0.05em">IEDC IDEA SPRINT 2026</text>

  <!-- Tagline -->
  <text x="760" y="300" font-family="'Inter', sans-serif" font-size="14" font-weight="400" fill="#9CA3AF">Start messy. Validate fast. Learn in public.</text>

  <!-- Divider -->
  <line x1="760" y1="330" x2="1140" y2="330" stroke="#374151" stroke-width="1"/>

  <!-- Venue block -->
  <text x="760" y="370" font-family="'Inter', sans-serif" font-size="11" font-weight="500" letter-spacing="0.15em" fill="#6B7280">VENUE</text>
  <text x="760" y="393" font-family="'Inter', sans-serif" font-size="15" font-weight="500" fill="#D1D5DB">College of Engineering</text>
  <text x="760" y="413" font-family="'Inter', sans-serif" font-size="15" font-weight="500" fill="#D1D5DB">Chengannur</text>

  <!-- Host block -->
  <text x="760" y="460" font-family="'Inter', sans-serif" font-size="11" font-weight="500" letter-spacing="0.15em" fill="#6B7280">HOST</text>
  <text x="760" y="483" font-family="'Inter', sans-serif" font-size="15" font-weight="500" fill="#D1D5DB">IEDC BOOTCAMP CEC</text>

  <!-- CTA pill -->
  <rect x="760" y="530" width="180" height="44" rx="22" fill="#2563EB"/>
  <text x="850" y="558" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#F7F7F2" text-anchor="middle">Join the Sprint →</text>

  <!-- URL watermark -->
  <text x="760" y="610" font-family="'Inter', sans-serif" font-size="12" fill="#4B5563">iedc-idea-sprint.vercel.app</text>
</svg>
